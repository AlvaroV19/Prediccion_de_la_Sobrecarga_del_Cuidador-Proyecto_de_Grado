{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Zarit</title>
    <style>
        :root {
            --bg: #f5f7fb;
            --card: #ffffff;
            --text: #182334;
            --muted: #64748b;
            --primary: #2164d8;
            --primary-soft: #e8f0ff;
            --border: #d7deea;
            --shadow: 0 20px 50px rgba(17, 34, 56, 0.12);
            --surface: #f8fbff;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top center, rgba(33, 100, 216, 0.12), transparent 28%),
                radial-gradient(circle at bottom left, rgba(15, 118, 110, 0.08), transparent 24%),
                linear-gradient(180deg, #fbfdff 0%, #f5f7fb 100%);
        }
        .shell {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
        }
        .auth-card {
            width: min(560px, 100%);
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 28px;
            box-shadow: var(--shadow);
            padding: 28px;
        }
        .tabs {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            margin-bottom: 26px;
            background: #edf2f8;
            padding: 8px;
            border-radius: 18px;
        }
        .tab {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 700;
            color: var(--muted);
            transition: background 0.18s ease, color 0.18s ease, transform 0.18s ease;
        }
        .tab.active {
            background: var(--card);
            color: var(--primary);
            box-shadow: 0 10px 20px rgba(17, 34, 56, 0.08);
        }
        .tab:hover { transform: translateY(-1px); }
        .eyebrow {
            display: inline-flex;
            padding: 7px 12px;
            border-radius: 999px;
            background: var(--primary-soft);
            color: var(--primary);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }
        h1 {
            margin: 14px 0 10px;
            font-size: clamp(30px, 4vw, 42px);
            line-height: 1.08;
        }
        p {
            margin: 0;
            color: var(--muted);
            line-height: 1.6;
        }
        .field {
            display: grid;
            gap: 8px;
            margin-top: 18px;
        }
        .password-field {
            position: relative;
        }
        label {
            font-size: 15px;
            font-weight: 700;
            color: #102033;
        }
        input {
            width: 100%;
            padding: 15px 16px;
            border-radius: 16px;
            border: 1px solid var(--border);
            font-size: 16px;
            background: #fff;
        }
        input:focus {
            outline: 3px solid rgba(33, 100, 216, 0.15);
            border-color: rgba(33, 100, 216, 0.55);
        }
        .password-toggle {
            position: absolute;
            top: 50%;
            right: 14px;
            transform: translateY(-50%);
            width: 36px;
            height: 36px;
            border: 0;
            border-radius: 12px;
            background: rgba(232, 240, 255, 0.9);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            cursor: pointer;
            box-shadow: inset 0 0 0 1px rgba(33, 100, 216, 0.10);
            transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
        }
        .password-toggle:hover {
            transform: translateY(-50%) scale(1.02);
            box-shadow: inset 0 0 0 1px rgba(33, 100, 216, 0.18), 0 6px 14px rgba(33, 100, 216, 0.10);
            background: #f1f6ff;
        }
        .password-toggle img {
            width: 18px;
            height: 18px;
            display: block;
        }
        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 22px;
            align-items: center;
            justify-content: space-between;
        }
        .actions button,
        .actions a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 160px;
            padding: 14px 18px;
            border-radius: 16px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 700;
            border: 0;
            cursor: pointer;
            transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease;
        }
        .btn-primary {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 12px 24px rgba(33, 100, 216, 0.18);
        }
        .btn-secondary {
            background: #eef3fa;
            color: var(--text);
        }
        .forgot-link {
            margin-left: auto;
            color: var(--primary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            white-space: nowrap;
        }
        .forgot-link:hover {
            text-decoration: underline;
        }
        .actions button:hover,
        .actions a:hover {
            transform: translateY(-1px);
        }
        .links {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 16px;
            font-size: 14px;
        }
        .links a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
        }
        .links .link-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 16px;
            border-radius: 14px;
            background: var(--primary-soft);
            color: var(--primary);
            border: 1px solid rgba(33, 100, 216, 0.16);
            box-shadow: 0 10px 18px rgba(33, 100, 216, 0.08);
            min-width: 150px;
        }
        .links .link-button:hover {
            text-decoration: none;
            transform: translateY(-1px);
        }
        .links a:hover:not(.link-button) { text-decoration: underline; }
        .status {
            display: none;
            margin-top: 16px;
            padding: 13px 15px;
            border-radius: 16px;
            font-size: 15px;
            line-height: 1.5;
        }
        .status.success {
            display: block;
            background: #dcfce7;
            color: #0f766e;
            border: 1px solid rgba(15, 118, 110, 0.18);
        }
        .status.error {
            display: block;
            background: #fee2e2;
            color: #b91c1c;
            border: 1px solid rgba(185, 28, 28, 0.18);
        }
        .hint {
            margin-top: 18px;
            padding: 14px 16px;
            border-radius: 16px;
            background: var(--surface);
            color: var(--muted);
            border: 1px solid var(--border);
            line-height: 1.6;
            font-size: 14px;
        }
        @media (max-width: 640px) {
            .shell { padding: 16px; }
            .auth-card { padding: 22px; border-radius: 24px; }
            .actions button,
            .actions a,
            .links .link-button { width: 100%; }
            .tabs { grid-template-columns: 1fr; }
            .links { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="shell">
        <main class="auth-card">
            <nav class="tabs" aria-label="Cambiar autenticación">
                <span class="tab active">Iniciar sesión</span>
                <a class="tab" href="{% url 'registro' %}">Crear cuenta</a>
            </nav>

            <h1>Inicia sesión</h1>
            <p>Ingresa tus credenciales para acceder al sistema.</p>

            <form id="loginForm" method="post" action="{% url 'login' %}" autocomplete="off">
                {% csrf_token %}
                <div class="field">
                    <label for="username">Usuario</label>
                    <input id="username" name="username" type="text" placeholder="admin" required>
                </div>
                <div class="field">
                    <label for="password">Contraseña</label>
                    <div class="password-field">
                        <input id="password" name="password" type="password" placeholder="zarit2026" required>
                        <button class="password-toggle" type="button" data-target="password" aria-label="Mostrar contraseña">
                            <img src="{% static 'images/open.svg' %}" alt="">
                        </button>
                    </div>
                </div>
                <div class="actions">
                    <button class="btn-primary" type="submit">Entrar</button>
                    <a class="forgot-link" href="{% url 'recuperar_password' %}">¿Olvidaste la contraseña?</a>
                </div>
            </form>

            {% if messages %}
                {% for message in messages %}
                    <div class="status {{ message.tags }}" role="alert">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <!-- <div class="hint">El acceso se valida contra FastAPI y la sesión guarda el token recibido.</div> -->
        </main>
    </div>

    <script>
        document.querySelectorAll('.password-toggle').forEach((button) => {
            button.addEventListener('click', () => {
                const input = document.getElementById(button.dataset.target);
                const image = button.querySelector('img');
                const isPassword = input.type === 'password';

                input.type = isPassword ? 'text' : 'password';
                image.src = isPassword ? "{% static 'images/close.svg' %}" : "{% static 'images/open.svg' %}";
                button.setAttribute('aria-label', isPassword ? 'Ocultar contraseña' : 'Mostrar contraseña');
            });
        });
    </script>
</body>
</html>
