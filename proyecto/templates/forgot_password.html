<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña</title>
    <style>
        :root {
            --bg: #f4f7fb;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --primary: #1f6feb;
            --primary-soft: #e8f0fe;
            --border: #dbe2ea;
            --shadow: 0 12px 30px rgba(31, 111, 235, 0.10);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at top right, rgba(31, 111, 235, 0.10), transparent 30%),
                radial-gradient(circle at bottom left, rgba(15, 118, 110, 0.08), transparent 25%),
                var(--bg);
            color: var(--text);
        }
        .shell {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
        }
        .card {
            width: min(560px, 100%);
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            box-shadow: var(--shadow);
            padding: 36px;
        }
        .eyebrow {
            display: inline-flex;
            padding: 7px 12px;
            border-radius: 999px;
            background: var(--primary-soft);
            color: var(--primary);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .3px;
            text-transform: uppercase;
        }
        h1 { margin: 14px 0 10px; font-size: clamp(30px, 4vw, 42px); line-height: 1.08; }
        p { margin: 0 0 22px; color: var(--muted); line-height: 1.6; }
        .field { display: grid; gap: 8px; margin-bottom: 16px; }
        label { font-size: 15px; font-weight: 700; color: #111827; }
        input {
            width: 100%;
            padding: 15px 16px;
            border-radius: 16px;
            border: 1px solid var(--border);
            font-size: 16px;
            background: #fff;
        }
        input:focus { outline: 3px solid rgba(31,111,235,0.15); border-color: rgba(31,111,235,0.55); }
        .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 10px; }
        .actions a, .actions button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 160px;
            padding: 14px 18px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            border: 0;
            cursor: pointer;
            transition: transform 0.18s ease;
        }
        .actions a:hover, .actions button:hover { transform: translateY(-1px); }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-secondary { background: #eef2f7; color: var(--text); }
        .alert { margin-bottom: 16px; padding: 12px 16px; border-radius: 14px; font-size: 14px; font-weight: 600; border: 1px solid; }
        .alert-error { background: #fff0f0; color: #c0392b; border-color: #f5c6c6; }
        .alert-success { background: #f0fff4; color: #1a7a40; border-color: #a8e6bf; }
        @media (max-width: 640px) {
            .card { padding: 24px; }
            .actions a, .actions button { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="shell">
        <main class="card">
            <span class="eyebrow">Recuperación</span>
            <h1>¿Olvidaste la contraseña?</h1>
            <p>Ingresa tu correo y te enviaremos las instrucciones para restablecer tu contraseña.</p>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert {% if message.tags == 'error' %}alert-error{% else %}alert-success{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form action="{% url 'recuperar_password' %}" method="post">
                {% csrf_token %}
                <div class="field">
                    <label for="email">Correo</label>
                    <input
                        id="email"
                        name="email"
                        type="email"
                        placeholder="correo@ejemplo.com"
                        autocomplete="email"
                        required
                        oninvalid="
                            if(this.validity.valueMissing){
                                this.setCustomValidity('No puedes dejar este campo vacío');
                            } else if(this.validity.typeMismatch){
                                this.setCustomValidity('Por favor, ingresa un correo electrónico válido');
                            }
                        "
                        oninput="this.setCustomValidity('')">
                </div>

                <div class="actions">
                    <button class="btn-primary" type="submit">Enviar instrucciones</button>
                    <a class="btn-secondary" href="{% url 'login' %}">Volver al login</a>
                </div>
            </form>
        </main>
    </div>
</body>
</html>
